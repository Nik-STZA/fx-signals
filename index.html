<title>FX Signals</title>

<style>
/* ---------- Tokens: chosen, not defaulted ------------------------------- */
:root{
  --paper:#eef0f4; --surface:#ffffff; --surface-2:#f6f7f9;
  --ink:#131722; --ink-2:#4a5261; --muted:#8a93a3; --line:#e2e6ec;
  --accent:#a4760f; --accent-soft:#f4ead2;
  --bull:#14805f; --bull-soft:#dcefe7;
  --bear:#bc3b2f; --bear-soft:#f6e0dc;
  --neutral:#67728a;
  --shadow:0 1px 2px rgba(19,23,34,.05),0 8px 24px -12px rgba(19,23,34,.18);
  --r:16px; --r-sm:11px;
  --mono:ui-monospace,"SF Mono","Cascadia Code","Segoe UI Mono",Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#090b0f; --surface:#161b22; --surface-2:#1c222b;
    --ink:#e7eaf0; --ink-2:#a8b0bd; --muted:#6b7482; --line:#262d38;
    --accent:#e0a63c; --accent-soft:#3a2f16;
    --bull:#33c08a; --bull-soft:#12312a;
    --bear:#e5645a; --bear-soft:#3a1f1e;
    --neutral:#8a93a3;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="light"]{
  --paper:#eef0f4; --surface:#ffffff; --surface-2:#f6f7f9;
  --ink:#131722; --ink-2:#4a5261; --muted:#8a93a3; --line:#e2e6ec;
  --accent:#a4760f; --accent-soft:#f4ead2;
  --bull:#14805f; --bull-soft:#dcefe7; --bear:#bc3b2f; --bear-soft:#f6e0dc;
  --neutral:#67728a; --shadow:0 1px 2px rgba(19,23,34,.05),0 8px 24px -12px rgba(19,23,34,.18);
}
:root[data-theme="dark"]{
  --paper:#090b0f; --surface:#161b22; --surface-2:#1c222b;
  --ink:#e7eaf0; --ink-2:#a8b0bd; --muted:#6b7482; --line:#262d38;
  --accent:#e0a63c; --accent-soft:#3a2f16;
  --bull:#33c08a; --bull-soft:#12312a; --bear:#e5645a; --bear-soft:#3a1f1e;
  --neutral:#8a93a3; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;line-height:1.45}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- App shell (phone column) ------------------------------------ */
.device{max-width:440px;margin:0 auto;min-height:100dvh;background:var(--surface);
  display:flex;flex-direction:column;position:relative;
  box-shadow:0 0 0 1px var(--line)}
@media (min-width:600px){
  .device{margin:22px auto;min-height:calc(100dvh - 44px);border-radius:28px;
    overflow:hidden;box-shadow:var(--shadow),0 0 0 1px var(--line)}
  body{padding:0 12px}
}

.topbar{display:flex;align-items:center;gap:10px;padding:16px 18px 10px;
  position:sticky;top:0;z-index:5;background:linear-gradient(var(--surface),var(--surface) 78%,transparent);
  backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:-.01em}
.beacon{width:22px;height:22px;border-radius:7px;background:
  radial-gradient(circle at 32% 30%,var(--accent),color-mix(in oklab,var(--accent),#000 22%));
  box-shadow:0 0 0 3px var(--accent-soft);flex:0 0 auto;display:grid;place-items:center}
.beacon::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--surface)}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.02em}
.spacer{flex:1}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--surface-2);
  color:var(--ink-2);width:38px;height:38px;border-radius:11px;font-size:16px;cursor:pointer;
  display:grid;place-items:center}
.iconbtn:active{transform:scale(.94)}

main{flex:1;overflow-y:auto;padding:6px 16px 96px;-webkit-overflow-scrolling:touch}

/* ---------- Bottom nav -------------------------------------------------- */
.nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);
  gap:2px;padding:8px 14px calc(10px + env(safe-area-inset-bottom));
  background:color-mix(in oklab,var(--surface),transparent 6%);
  backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.nav button{appearance:none;border:0;background:none;cursor:pointer;color:var(--muted);
  font:inherit;font-size:11px;font-weight:600;letter-spacing:.02em;padding:6px 4px;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;gap:4px}
.nav button .ico{font-size:17px;line-height:1}
.nav button[aria-current="true"]{color:var(--accent)}

/* ---------- Cards & type ------------------------------------------------ */
.eyebrow{font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 16px;margin:12px 0;box-shadow:var(--shadow)}
.card.tap{cursor:pointer;transition:transform .12s,border-color .12s}
.card.tap:active{transform:scale(.985)}
.card h3{margin:0;font-size:14px;letter-spacing:-.01em}
h1.day{font-size:23px;margin:2px 0 0;letter-spacing:-.02em;text-wrap:balance}

.daynav{display:flex;align-items:center;gap:10px;margin:10px 0 2px}
.daynav .arrow{width:40px;height:40px;flex:0 0 auto}
.daynav .mid{flex:1;text-align:center}
.daynav .mid .eyebrow{display:block}

/* direction banner */
.dir{display:flex;align-items:center;gap:14px;border-radius:var(--r);padding:15px 16px;margin:12px 0;
  border:1px solid var(--line)}
.dir .big{font-size:22px;font-weight:750;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.dir.bullish{background:var(--bull-soft);border-color:color-mix(in oklab,var(--bull),transparent 65%)}
.dir.bullish .big{color:var(--bull)}
.dir.bearish{background:var(--bear-soft);border-color:color-mix(in oklab,var(--bear),transparent 65%)}
.dir.bearish .big{color:var(--bear)}
.dir.mixed,.dir.neutral{background:var(--surface-2)}
.dir.mixed .big,.dir.neutral .big{color:var(--neutral)}
.dir .bars{flex:1;min-width:0}
.dir .barrow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);margin:3px 0}
.dir .barrow b{width:34px;text-align:right;font-family:var(--mono);color:var(--ink)}
.track2{flex:1;height:7px;border-radius:5px;background:var(--surface);overflow:hidden;
  border:1px solid var(--line)}
.track2 span{display:block;height:100%}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:12px;
  background:var(--surface-2);border:1px solid var(--line);cursor:pointer;font-size:13px;font-weight:600;
  letter-spacing:.01em}
.chip:active{transform:scale(.95)}
.chip .tk{font-family:var(--mono);font-weight:650}
.chip .n{color:var(--muted);font-family:var(--mono);font-size:11px;font-weight:600}
.arrow-b{color:var(--bull)} .arrow-s{color:var(--bear)} .arrow-n{color:var(--neutral)}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:11.5px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);
  padding:5px 9px;border-radius:8px}
.tag b{color:var(--muted);font-family:var(--mono);font-weight:600;margin-left:4px}

/* "The read" — the daily narrative */
.read{border-left:3px solid var(--accent);background:var(--surface-2)}
.read .tldr{font-weight:650;font-size:14px;letter-spacing:-.005em;margin:6px 0 8px;
  color:var(--ink);text-wrap:balance}
.read p{font-size:14.5px;line-height:1.62;color:var(--ink-2);margin:0;max-width:62ch}
.read p b,.read p strong{color:var(--ink)}

.rowhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.badge{font-size:11px;font-weight:700;font-family:var(--mono);padding:3px 8px;border-radius:20px;
  background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:12.5px}
.sub{color:var(--ink-2);font-size:13px;margin:3px 0 0}

/* early-signal spark */
.esig{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line)}
.esig:first-of-type{border-top:0}
.esig .nm{font-weight:650;font-size:13.5px;min-width:0;flex:1}
.esig .nm span{display:block;font-size:11px;color:var(--muted);font-weight:500}
.spark{display:flex;align-items:flex-end;gap:3px;height:30px}
.spark i{width:7px;background:color-mix(in oklab,var(--accent),transparent 55%);border-radius:3px 3px 0 0;
  display:block}
.spark i.last{background:var(--accent)}

/* track ring */
.ring{width:66px;height:66px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:conic-gradient(var(--accent) var(--p,0%),var(--surface-2) 0)}
.ring::after{content:"";position:absolute;width:50px;height:50px;border-radius:50%;background:var(--surface)}
.ring b{position:relative;font-family:var(--mono);font-weight:700;font-size:15px}
.ring-wrap{position:relative;display:grid;place-items:center;width:66px;height:66px}

/* list rows (signals / record) */
.lrow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);
  cursor:pointer}
.lrow:first-child{border-top:0}
.lrow .tk{font-family:var(--mono);font-weight:650;font-size:14px;min-width:64px}
.lrow .cat{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.lrow .grow{flex:1;min-width:0}
.trail{font-family:var(--mono);letter-spacing:1px;font-size:13px}
.pos{color:var(--bull);font-family:var(--mono);font-weight:650}
.neg{color:var(--bear);font-family:var(--mono);font-weight:650}
.flat{color:var(--muted);font-family:var(--mono)}

/* event pills */
.ev{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.ev:first-of-type{border-top:0}
.ev .st{width:20px;text-align:center}
.ev .when{font-family:var(--mono);color:var(--muted);font-size:11.5px;min-width:44px}
.ev .it{font-family:var(--mono);font-weight:650;min-width:56px}
.ev .rt{margin-left:auto;font-family:var(--mono);font-weight:650}

/* ---------- Instrument sheet ------------------------------------------- */
.sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
  background:var(--surface);max-width:440px;margin:0 auto;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.3,.8,.3,1)}
@media (min-width:600px){.sheet{margin:22px auto;max-height:calc(100dvh - 44px);border-radius:28px;overflow:hidden}}
.sheet.open{transform:translateY(0)}
.sheet header{display:flex;align-items:center;gap:12px;padding:16px 18px 8px}
.sheet header .tk{font-family:var(--mono);font-weight:700;font-size:20px}
.sheet .body{flex:1;overflow-y:auto;padding:6px 18px 30px}
.kv{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 2px}
.kv .pill{font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:20px;padding:4px 10px;color:var(--ink-2)}

/* chart */
.chartwrap{position:relative;margin:14px 0 4px}
svg.chart{width:100%;height:180px;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.chart .area{fill:color-mix(in oklab,var(--accent),transparent 86%)}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke;
  stroke-linejoin:round;stroke-linecap:round}
.chart .cross{stroke:var(--muted);stroke-dasharray:3 3;vector-effect:non-scaling-stroke;opacity:0}
/* HTML overlay: crisp dots + forward-return labels (no viewBox distortion) */
.mkov{position:absolute;top:0;left:0;right:0;height:180px;pointer-events:none}
.ovdot{position:absolute;width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%);
  box-shadow:0 0 0 2px var(--surface)}
.ovdot.b{background:var(--bull)} .ovdot.s{background:var(--bear)}
.ovdot.end{width:9px;height:9px;background:var(--accent)}
.mklab{position:absolute;font-family:var(--mono);font-size:10px;font-weight:700;white-space:nowrap;
  padding:1px 4px;border-radius:5px;line-height:1.3;
  background:color-mix(in oklab,var(--surface),transparent 8%);
  box-shadow:0 0 0 1px var(--line)}
.mklab.pos{color:var(--bull)} .mklab.neg{color:var(--bear)} .mklab.flatv{color:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);
  font-family:var(--mono);font-size:11px;padding:4px 7px;border-radius:7px;opacity:0;
  transform:translate(-50%,-130%);white-space:nowrap;z-index:2}
.axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;
  color:var(--muted);margin-top:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin:10px 0 2px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}

.disc{font-size:11px;color:var(--muted);text-align:center;padding:14px 8px 4px;line-height:1.5}
.divlabel{margin:20px 0 2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const DATA = JSON.parse(document.getElementById('appdata').textContent);
const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const fmtDate = d => new Date(d+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const fmtFull = d => new Date(d+'T00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
const toneArrow = t => t==='bullish'?'▲':t==='bearish'?'▼':t==='mixed'?'◆':'·';
const toneCls   = t => t==='bullish'?'arrow-b':t==='bearish'?'arrow-s':'arrow-n';
const trailTick = t => `<span class="${toneCls(t)}">${toneArrow(t)}</span>`;
const pct = v => v==null?'—':(v>0?'+':'')+v.toFixed(1)+'%';
const pctCls = v => v==null?'flat':v>0.3?'pos':v<-0.3?'neg':'flat';

let dayIdx = DATA.days.length-1;   // start on the most recent brief
let curView = 'brief';

/* ---- Theme toggle ---------------------------------------------------- */
$('#themeBtn').onclick = ()=>{
  const now = document.documentElement.getAttribute('data-theme')
    || (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  document.documentElement.setAttribute('data-theme', now==='dark'?'light':'dark');
};

/* ---- Nav ------------------------------------------------------------- */
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{
  curView=b.dataset.view;
  document.querySelectorAll('.nav button').forEach(x=>x.setAttribute('aria-current', x===b));
  render();
});

/* ---- Views ----------------------------------------------------------- */
function render(){
  const v=$('#view'); v.innerHTML=''; v.scrollTop=0;
  if(curView==='brief') renderBrief(v);
  else if(curView==='signals') renderSignals(v);
  else renderRecord(v);
}

function renderBrief(v){
  const d = DATA.days[dayIdx];
  // day navigation
  const nav = el('div','daynav');
  const prev = el('button','iconbtn arrow','◀'); prev.disabled = dayIdx===0;
  const next = el('button','iconbtn arrow','▶'); next.disabled = dayIdx===DATA.days.length-1;
  prev.onclick=()=>{if(dayIdx>0){dayIdx--;render();}};
  next.onclick=()=>{if(dayIdx<DATA.days.length-1){dayIdx++;render();}};
  const mid = el('div','mid',`<span class="eyebrow">${fmtFull(d.date)}</span><h1 class="day">${d.title}</h1>`);
  nav.append(prev,mid,next); v.append(nav);

  // direction banner
  const total=d.bull+d.bear;
  const bp=total?Math.round(d.bull/total*100):50;
  const label={bullish:'Bullish',bearish:'Bearish',mixed:'Mixed',neutral:'Neutral'}[d.direction];
  const dir = el('div','dir '+d.direction);
  dir.innerHTML=`<div class="big">${toneArrow(d.direction)} ${label}</div>
    <div class="bars">
      <div class="barrow"><span class="track2"><span style="width:${bp}%;background:var(--bull)"></span></span><b>${d.bull}</b></div>
      <div class="barrow"><span class="track2"><span style="width:${100-bp}%;background:var(--bear)"></span></span><b>${d.bear}</b></div>
    </div>`;
  v.append(dir);

  // The read -- daily narrative
  if(d.summary){
    const rd=el('div','card read');
    rd.append(el('div','eyebrow','The read'));
    if(d.summary.tldr) rd.append(el('div','tldr',d.summary.tldr));
    if(d.summary.paragraph) rd.append(el('p',null,d.summary.paragraph));
    v.append(rd);
  }

  // instruments in focus
  const c1=el('div','card');
  c1.append(el('div','eyebrow','In focus today'));
  const chips=el('div','chips');
  d.instruments.forEach(it=>{
    const ch=el('button','chip');
    ch.innerHTML=`<span class="tk">${it.sym}</span>${trailTick(it.tone)}<span class="n">${it.count}</span>`;
    ch.onclick=()=>openInstrument(it.sym);
    chips.append(ch);
  });
  c1.append(chips);
  if(d.themes.length){
    const tags=el('div','tags');
    d.themes.forEach(t=>tags.append(el('span','tag',`${t.name}<b>${t.count}</b>`)));
    c1.append(el('div','eyebrow','Themes discussed',),tags);
    c1.querySelectorAll('.eyebrow')[1].style.marginTop='14px';
  }
  v.append(c1);

  // early signals
  if(d.early.length){
    const c=el('div','card');
    c.append(el('div','rowhead',`<div class="eyebrow">Early signals</div><span class="badge">${d.early.length} building</span>`));
    d.early.forEach(s=>{
      const mx=Math.max(...s.streak,1);
      const spark=s.streak.map((n,i)=>`<i class="${i===s.streak.length-1?'last':''}" style="height:${Math.max(12,n/mx*30)}px"></i>`).join('');
      const row=el('div','esig');
      row.innerHTML=`<div class="nm">${s.name}<span>${s.run} days in a row · building into today</span></div><div class="spark">${spark}</div>`;
      if(DATA.ledger[s.name]){row.style.cursor='pointer';row.onclick=()=>openInstrument(s.name);}
      c.append(row);
    });
    v.append(c);
  }

  // track record teaser
  const t=DATA.track;
  const tr=el('div','card tap');
  tr.innerHTML=`<div class="rowhead"><div><div class="eyebrow">Track record</div>
      <div class="sub">Has the show's call actually moved the market? ${t.confirmed}/${t.decided} did.</div></div>
      <div class="ring-wrap"><div class="ring" style="--p:${t.hit_rate}%"></div><b>${t.hit_rate}%</b></div></div>`;
  tr.onclick=()=>{curView='record';syncNav();render();};
  v.append(tr);

  // caution
  if(d.caution.length){
    const c=el('div','card');
    c.append(el('div','eyebrow','Caution flags'));
    d.caution.slice(0,4).forEach(x=>c.append(el('p','sub','“'+x+'”')));
    v.append(c);
  }
  if(d.conviction.length){
    v.append(el('p','disc','Conviction language today: '+d.conviction.map(x=>'“'+x+'”').join('  ·  ')));
  }
  v.append(el('p','disc','Signal from transcripts · outcome from real prices. Research prompts only — not financial advice.'));
}

function renderSignals(v){
  v.append(el('h1','day','Signals radar'));
  v.append(el('p','sub','Every instrument the show is tracking, most-followed first. Tap for its price story.'));
  const items=Object.entries(DATA.ledger).sort((a,b)=>b[1].days-a[1].days||b[1].total-a[1].total);
  const c=el('div','card');
  items.forEach(([sym,r])=>{
    const trail=r.trail.map(t=>trailTick(t.tone)).join('');
    const row=el('div','lrow');
    row.innerHTML=`<div><div class="tk">${sym}</div><div class="cat">${r.cat}</div></div>
      <div class="grow"><div class="trail">${trail}</div>
      <div class="small muted">${r.days} days · ${r.total} mentions</div></div>
      <div class="muted">›</div>`;
    row.onclick=()=>openInstrument(sym);
    c.append(row);
  });
  v.append(c);
}

function renderRecord(v){
  const t=DATA.track;
  v.append(el('h1','day','Track record'));
  v.append(el('p','sub','Signal = what the show said. Outcome = real Yahoo Finance prices afterwards.'));
  const hero=el('div','card');
  hero.innerHTML=`<div class="rowhead">
     <div><div class="eyebrow">Hit rate</div>
       <div class="sub">${t.confirmed} of ${t.decided} directional calls moved the implied way within 10 trading days. ${t.pending} still maturing.</div>
       <div class="sub">Avg next-day move in the implied direction <b class="pos">${pct(t.t1avg)}</b> (n=${t.t1n})${t.avg_days?` · typically moves in <b>${t.avg_days}</b> day(s)`:''}.</div></div>
     <div class="ring-wrap"><div class="ring" style="--p:${t.hit_rate}%"></div><b>${t.hit_rate}%</b></div></div>`;
  v.append(hero);

  v.append(el('div','eyebrow divlabel','Mention → market move'));
  const c=el('div','card');
  const evs=DATA.events.slice().sort((a,b)=>b.date<a.date?-1:1);
  evs.forEach(e=>{
    const icon={confirmed:'✅',contradicted:'❌',flat:'➖',pending:'⏳'}[e.status]||'·';
    const r1=e.r['1'];
    const rt = e.status==='pending' ? '<span class="flat">pending</span>'
             : `<span class="${pctCls(r1)}">${pct(r1)}</span>`;
    const row=el('div','ev');
    row.innerHTML=`<span class="st">${icon}</span><span class="when">${fmtDate(e.date)}</span>
      <span class="it">${e.item}</span> ${trailTick(e.dir)} <span class="rt">${rt}</span>`;
    row.style.cursor='pointer'; row.onclick=()=>openInstrument(e.item);
    c.append(row);
  });
  v.append(c);
  v.append(el('p','disc','A move ≥1% the implied way within 10 trading days counts as confirmed. Educational only — not financial advice.'));
}

function syncNav(){document.querySelectorAll('.nav button').forEach(x=>x.setAttribute('aria-current', x.dataset.view===curView));}

/* ---- Instrument sheet ------------------------------------------------ */
const sheet=$('#sheet');
$('#sheetClose').onclick=()=>sheet.classList.remove('open');
function openInstrument(sym){
  const r=DATA.ledger[sym]; if(!r) return;
  $('#sheetTk').textContent=sym;
  const b=$('#sheetBody'); b.innerHTML=''; b.scrollTop=0;
  b.append(el('div','kv',
    `<span class="pill">${r.cat}</span><span class="pill">first seen ${fmtDate(r.first_seen)}</span>
     <span class="pill">${r.days} days · ${r.total} mentions</span>`));

  // sentiment trail
  b.append(el('div','eyebrow divlabel','Sentiment trail'));
  b.append(el('div','trail',r.trail.map(t=>`${trailTick(t.tone)}`).join(' ')
    +'  '+`<span class="small muted">${r.trail.map(t=>fmtDate(t.date)).join(' · ')}</span>`));

  // this instrument's events (needed by the chart labels + the list below)
  const evsAll=DATA.events.filter(e=>e.item===sym);

  // price chart
  const series=DATA.prices[sym];
  if(series && series.length>1){
    b.append(el('div','eyebrow divlabel','Price vs. when it was flagged'));
    b.append(buildChart(series, r.trail, evsAll));
    b.append(el('div','legend',
      `<span><i style="background:var(--accent)"></i>price</span>
       <span><i style="background:var(--bull)"></i>flagged bullish</span>
       <span><i style="background:var(--bear)"></i>flagged bearish</span>
       <span>labels = forward move from that day</span>`));
  } else {
    b.append(el('p','sub','No price series available for this item.'));
  }

  // this instrument's events
  const evs=evsAll.slice().sort((a,b)=>b.date<a.date?-1:1);
  if(evs.length){
    b.append(el('div','eyebrow divlabel','Its calls, scored'));
    const c=el('div','card');
    evs.forEach(e=>{
      const icon={confirmed:'✅',contradicted:'❌',flat:'➖',pending:'⏳'}[e.status]||'·';
      const rr=[1,3,5,10].map(h=>{const val=e.r[String(h)];return `t+${h} ${val==null?'—':pct(val)}`;}).join('  ');
      const row=el('div','ev');
      row.innerHTML=`<span class="st">${icon}</span><span class="it">${trailTick(e.dir)} ${e.dir}</span>
        <span class="when">${fmtDate(e.date)}</span><span class="rt small ${e.status==='pending'?'flat':''}">${e.status}${e.lag?' · '+e.lag+'d':''}</span>`;
      c.append(row);
      c.append(el('div','small muted tnum',rr));
      c.lastChild.style.padding='0 0 8px 30px';
    });
    b.append(c);
  }
  b.append(el('p','disc','Signal from the transcript, outcome from real prices. Not financial advice.'));
  sheet.classList.add('open');
}

/* The forward return that best tells the story:
   - confirmed  -> the move at the horizon that confirmed it (days_to_move)
   - otherwise  -> the furthest horizon we have data for
   - pending    -> null */
function bestReturn(ev){
  if(!ev) return null;
  if(ev.status==='confirmed' && ev.lag!=null && ev.r[String(ev.lag)]!=null)
    return {h:ev.lag, v:ev.r[String(ev.lag)]};
  for(const h of [10,5,3,1]){ const v=ev.r[String(h)]; if(v!=null) return {h,v}; }
  return null; // still pending
}

/* ---- SVG line + HTML overlay (crisp dots & forward-return labels) ----- */
function buildChart(series, trail, events){
  const W=340,H=170,pad=6;
  const xs=series.map(p=>p[0]), ys=series.map(p=>p[1]);
  const min=Math.min(...ys),max=Math.max(...ys),span=(max-min)||1;
  const X=i=>pad+i/(series.length-1)*(W-2*pad);
  const Y=v=>pad+(1-(v-min)/span)*(H-2*pad);
  const xPct=i=>X(i)/W*100, yPct=v=>Y(v)/H*100;
  const line=series.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join(' ');
  const area=`M${X(0)} ${H-pad} `+series.map((p,i)=>`L${X(i).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join(' ')+` L${X(series.length-1)} ${H-pad} Z`;
  const grid=[0,.5,1].map(f=>`<line class="grid" x1="${pad}" x2="${W-pad}" y1="${(pad+f*(H-2*pad)).toFixed(1)}" y2="${(pad+f*(H-2*pad)).toFixed(1)}"></line>`).join('');
  const last=series.length-1;
  const wrap=el('div','chartwrap');
  wrap.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="price chart">
    ${grid}<path class="area" d="${area}"></path><path class="line" d="${line}"></path>
    <line class="cross" id="cx" y1="${pad}" y2="${H-pad}"></line></svg>
    <div class="mkov"></div>
    <div class="tip" id="tip"></div>
    <div class="axis"><span>${fmtDate(xs[0])}</span><span>${fmtDate(xs[last])}</span></div>`;

  // Overlay: flagged-day dots + forward-return labels (staggered to avoid overlap).
  const evByDate={}; events.forEach(e=>evByDate[e.date]=e);
  const ov=wrap.querySelector('.mkov');
  const flags=trail.filter(t=>t.tone==='bullish'||t.tone==='bearish');
  flags.forEach((t,k)=>{
    const i=xs.indexOf(t.date); if(i<0) return;
    const left=Math.min(92,Math.max(8,xPct(i))), top=yPct(series[i][1]);
    const dot=el('span','ovdot '+(t.tone==='bullish'?'b':'s'));
    dot.style.left=left+'%'; dot.style.top=top+'%'; ov.append(dot);
    const br=bestReturn(evByDate[t.date]);
    const lab=el('span','mklab '+(br==null?'flatv':br.v>0.3?'pos':br.v<-0.3?'neg':'flatv'));
    lab.textContent = br==null ? '⏳' : (br.v>0?'+':'')+br.v.toFixed(1)+'%';
    const up = (k%2===0);                       // alternate above / below the dot
    lab.style.left=left+'%';
    lab.style.top=top+'%';
    lab.style.transform=`translate(-50%, ${up?'-165%':'65%'})`;
    ov.append(lab);
  });
  // endpoint marker
  const endDot=el('span','ovdot end');
  endDot.style.left=xPct(last)+'%'; endDot.style.top=yPct(series[last][1])+'%'; ov.append(endDot);

  // crosshair + tooltip
  const svg=wrap.querySelector('svg'), cx=wrap.querySelector('#cx'), tip=wrap.querySelector('#tip');
  const move=ev=>{
    const rect=svg.getBoundingClientRect();
    const px=( (ev.touches?ev.touches[0].clientX:ev.clientX) - rect.left)/rect.width;
    let i=Math.round(px*(series.length-1)); i=Math.max(0,Math.min(series.length-1,i));
    const gx=X(i);
    cx.setAttribute('x1',gx);cx.setAttribute('x2',gx);cx.style.opacity=1;
    tip.style.opacity=1; tip.style.left=(gx/W*100)+'%'; tip.style.top=(Y(series[i][1])/H*100)+'%';
    tip.textContent=`${fmtDate(xs[i])} · ${series[i][1]}`;
  };
  const leave=()=>{cx.style.opacity=0;tip.style.opacity=0;};
  svg.addEventListener('pointermove',move); svg.addEventListener('pointerleave',leave);
  svg.addEventListener('touchmove',move,{passive:true}); svg.addEventListener('touchend',leave);
  return wrap;
}

$('#genline').textContent = 'updated '+fmtDate(DATA.generated);
render();
</script>
